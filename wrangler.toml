# Cloudflare Workers 설정 (GitHub 연동 배포용)
# Pages 방식이 아니라 Workers 방식으로 배포합니다.
# ROOM_KEY / API_KEY 는 이 파일에 적지 말고 대시보드 Settings > Variables 에서 Secret 으로 넣으세요.

name = "ai-team-room"
main = "_worker.js"
compatibility_date = "2026-11-01"

[assets]
directory = "."

[[d1_databases]]
binding = "DB"
database_name = "ai-team-room"
database_id = "bee04f5a-f4ce-4367-972d-7f5ff20f2811"
